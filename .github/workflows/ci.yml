name: Canon

# Pull requests run the static gates and the Python suite on the oldest and
# newest supported Python. Heavier checks run only when their inputs change.
# Pushes to main, manual runs and PRs labeled `full-ci` run everything; the
# release workflow requires that full push run on the exact release commit.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      code: ${{ steps.select.outputs.code }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      browser: ${{ steps.select.outputs.browser }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          full=false code=true dependencies=false browser=false
          if [[ "$EVENT" != pull_request || "$FULL_LABEL" == true ]]; then
            full=true
          else
            changed=$(git diff --name-only "$BASE"...HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            matches() { grep -Eq "$1" <<<"$changed"; }
            matches '^\.github/workflows/ci\.yml$' && full=true
            # Only documentation changed: keep the documentation and lint gates.
            grep -Evq '^(docs/|tickets/|LICENSE$)|\.md$' <<<"$changed" || code=false
            matches '^(pyproject\.toml|uv\.lock|release\.toml|examples/reference-service/pyproject\.toml|scripts/(check_distributions|smoke_installed|check_streams_artifacts|check_webrtc_artifacts|check_telemetry_compatibility)\.py)$' && dependencies=true
            matches '^(fastapi_canon/integrations/webrtc/|examples/webrtc/|tests/browser/|package\.json$|pnpm-lock\.yaml$)' && browser=true
          fi
          if [[ "$full" == true ]]; then
            code=true dependencies=true browser=true
            matrix='[{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"ubuntu-latest","python":"3.14"},{"os":"windows-latest","python":"3.14"}]'
          else
            matrix='[{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.14"}]'
          fi
          {
            echo "full=$full"
            echo "code=$code"
            echo "dependencies=$dependencies"
            echo "browser=$browser"
            echo "matrix=$matrix"
          } | tee -a "$GITHUB_OUTPUT"

  static:
    name: Architecture, lint, types and clients
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --all-groups --python 3.12
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: uv run --locked python scripts/check.py architecture --report-dir dist/checks
      - run: uv run --locked python scripts/check.py lint --report-dir dist/checks
      - if: needs.changes.outputs.code == 'true'
        run: uv run --locked python scripts/check.py types --report-dir dist/checks
      - if: needs.changes.outputs.code == 'true'
        run: uv run --locked python scripts/check.py clients --report-dir dist/checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-static
          path: dist/checks/
          if-no-files-found: ignore

  database-postgres:
    name: PostgreSQL database and migration contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canon
          POSTGRES_PASSWORD: canon-test
          POSTGRES_DB: canon
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U canon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANON_TEST_POSTGRES_URL: postgresql+asyncpg://canon:canon-test@localhost:5432/canon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest -q tests/integration/integrations/database --durations=30 --junitxml=dist/checks/postgres.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-postgres
          path: dist/checks/
          if-no-files-found: ignore

  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Static gates run once; real Python and generated-client runtime tests
      # retain the complete supported platform/version matrix.
      - run: uv run --locked python scripts/check.py test --report-dir dist/checks
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        name: Native telemetry bridge against minimum and locked FastAPI
        run: uv run --locked python scripts/check_telemetry_compatibility.py --python 3.12
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && needs.changes.outputs.browser == 'true'
        name: WebRTC sessions in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          uv run --locked python scripts/check.py browser --report-dir dist/checks
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && needs.changes.outputs.dependencies == 'true'
        run: uv run --locked python scripts/check_distributions.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && needs.changes.outputs.full == 'true'
        run: uv run --locked python scripts/check_streams_artifacts.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && needs.changes.outputs.full == 'true'
        run: uv run --locked python scripts/check_webrtc_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: dist/checks/
          if-no-files-found: ignore

  minimum-dependencies:
    name: Minimum dependencies / Python 3.12
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --all-groups --python 3.12
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Each extra on its own, installed from built wheels at its lowest bounds.
      - name: Installed wheels with minimum direct dependencies
        run: uv run --locked python scripts/check_distributions.py --python 3.12 --dependencies minimum
      # The development environment combines every extra, so this resolves the
      # lowest versions that satisfy all bounds together and runs the full suite.
      - name: Resolve the lowest allowed direct dependencies
        run: |
          uv lock --resolution lowest-direct
          uv sync --frozen --all-groups --python 3.12
      - name: Report resolved versions
        run: >-
          uv pip list --python .venv |
          grep -Ei '^(fastapi|starlette|pydantic|pydantic-core|dishka|anyio|aiortc|fastmcp|opentelemetry-(api|instrumentation)|sqlalchemy|httpx) '
      - run: uv run --frozen pytest -q --durations=30 --junitxml=dist/checks/minimum.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-minimum
          path: dist/checks/
          if-no-files-found: ignore
