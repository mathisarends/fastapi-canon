name: Canon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-postgres:
    name: PostgreSQL database and migration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canon
          POSTGRES_PASSWORD: canon-test
          POSTGRES_DB: canon
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U canon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANON_TEST_POSTGRES_URL: postgresql+asyncpg://canon:canon-test@localhost:5432/canon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest -q tests/integration/integrations/database
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: uv run --locked python scripts/check.py all
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        name: Native telemetry bridge against minimum and locked FastAPI
        run: uv run --locked python scripts/check_telemetry_compatibility.py --python 3.12
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        name: WebRTC sessions in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          uv run --locked python scripts/check.py browser
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked python scripts/check_distributions.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked python scripts/check_streams_artifacts.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked python scripts/check_webrtc_artifacts.py
