[codegen]
version = 1

[codegen.sources.api]
kind = "openapi"
source = "app:app"
output = "contracts/openapi.json"

[codegen.sources.control]
kind = "openrpc"
source = "app:app"
output = "contracts/openrpc.json"

[codegen.targets.browser]
language = "typescript"
sources = ["api", "control"]
output = "generated/typescript"

[codegen.targets.python]
language = "python"
sources = ["api", "control"]
output = "generated/python/api_client"
package = "api_client"
