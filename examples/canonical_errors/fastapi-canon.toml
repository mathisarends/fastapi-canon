[codegen]
version = 2
app = "app:create_app"
contracts = "contracts"

[codegen.targets.streams]
generator = "sse"
language = "typescript"
output = "dist/streams/typescript"

[codegen.targets.rpc]
generator = "websockets"
language = "typescript"
output = "dist/rpc/typescript"
client-name = "ProjectsClient"

[codegen.targets.python_streams]
generator = "sse"
language = "python"
output = "dist/streams/python"

[codegen.targets.python_rpc]
generator = "websockets"
language = "python"
output = "dist/rpc/python/projects_client"
client-name = "ProjectsClient"
package = "projects_client"
