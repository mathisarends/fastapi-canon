[codegen]
version = 2
app = "app:create_app"
contracts = "contracts"

[codegen.targets.streams]
generator = "sse"
language = "typescript"
output = "dist/streams/typescript"
include-operations = ["projects.events"]
diagnostics = "dist/reports/typescript-sse.json"
strict = true
allow-diagnostics = "streams-typescript-allowances.json"

[codegen.targets.rpc]
generator = "websockets"
language = "typescript"
output = "dist/rpc/typescript"
client-name = "ProjectsClient"

[codegen.targets.python_streams]
generator = "sse"
language = "python"
output = "dist/streams/python"
python-http-client = "httpx2"
include-operations = ["projects.events"]
diagnostics = "dist/reports/python-sse.json"
strict = true
allow-diagnostics = "streams-python-allowances.json"

[codegen.targets.python_rpc]
generator = "websockets"
language = "python"
output = "dist/rpc/python/projects_client"
client-name = "ProjectsClient"
package = "projects_client"
