version = 1

[contract]
source = "automation:app"
base_url = "wss://{host}"
output = "automation.openrpc.json"

[contract.variables]
host = "api.example.com"

[[clients]]
language = "python"
output = "python/automation_client"
package = "automation_client"
with_transport = "websocket"

[[clients]]
language = "typescript"
output = "typescript"
with_transport = "websocket"
