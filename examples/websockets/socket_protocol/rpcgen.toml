version = 1

[contract]
source = "calculator:app"
base_url = "ws://{host}"
output = "calculator.openrpc.json"

[contract.variables]
host = "localhost:8000"

[[clients]]
language = "python"
output = "python/calc_client"
package = "calc_client"
with_transport = "websocket"
bindings = ["calc_binding:BINDING"]

[[clients]]
language = "typescript"
output = "typescript"
with_transport = "websocket"
bindings = ["calc_binding:BINDING"]
