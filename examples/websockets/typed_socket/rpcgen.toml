version = 1

[contract]
source = "ping:app"
base_url = "ws://{host}"
output = "ping.openrpc.json"

[[clients]]
language = "python"
output = "python/ping_client"
package = "ping_client"
with_transport = "websocket"

[[clients]]
language = "typescript"
output = "typescript"
with_transport = "websocket"
