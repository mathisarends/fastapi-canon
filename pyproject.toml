[project]
name = "fastapi-canon"
version = "0.15.0"
description = "Typed FastAPI applications with Dishka, HTTP contracts, SSE, WebSockets, WebRTC and client generation"
readme = "README.md"
authors = [{ name = "mathisarends" }]
license = "MIT"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dishka>=1.10,<1.11",
    "fastapi>=0.121,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
database = ["sqlalchemy[asyncio]>=2.0.38,<3", "anyio>=4,<5"]
sqlite = ["fastapi-canon[database]==0.15.0", "aiosqlite>=0.20,<1"]
postgres = ["fastapi-canon[database]==0.15.0", "asyncpg>=0.30,<1"]
sqlmodel = ["fastapi-canon[database]==0.15.0", "sqlmodel>=0.0.22,<0.1"]
migrations = ["fastapi-canon[database]==0.15.0", "alembic>=1.14,<2"]
otel = [
    "fastapi>=0.143,<1",
    "opentelemetry-api>=1.40,<2",
    "opentelemetry-instrumentation>=0.61b0,<1",
]
otel-httpx = [
    "fastapi-canon[otel]==0.15.0",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
]
otel-sqlalchemy = ["fastapi-canon[otel]==0.15.0", "sqlalchemy[asyncio]>=2.0,<3"]
sse = ["fastapi>=0.143.3,<1", "pydantic>=2.11.2,<3"]
websockets = [
    "pydantic>=2.11,<3",
    "pydantic-core>=2.33",
    "typing-extensions>=4.12.2",
]
webrtc = ["anyio>=4", "starlette>=0.41", "typing-extensions>=4.12"]
aiortc = ["aiortc>=1.14,<1.16"]
codegen = [
    "jsonschema>=4.23,<5", "jinja2>=3.1,<4",
    "pydantic>=2.11.2,<3", "typing-extensions>=4.12.2",
]
mcp = [
    "fastmcp>=4.1.3,<5",
    "pydantic>=2.12,<3",
]

[project.scripts]
fastapi-canon = "fastapi_canon.cli:main"

[project.urls]
Homepage = "https://github.com/mathisarends/fastapi_canon"
Repository = "https://github.com/mathisarends/fastapi_canon"
Documentation = "https://github.com/mathisarends/fastapi_canon/tree/main/docs"
Issues = "https://github.com/mathisarends/fastapi_canon/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_canon"]
exclude = ["**/AGENTS.md", "**/.ruff.toml"]

[tool.hatch.build.targets.sdist]
include = ["/fastapi_canon", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/AGENTS.md", "**/.ruff.toml"]

[dependency-groups]
dev = [
    "build>=1.2",
    "fastapi-canon-reference[otel]",
    "fastapi-canon[aiortc,codegen,mcp,migrations,otel,postgres,sqlite,sqlmodel,sse,webrtc,websockets]==0.15.0",
    "httpx2>=2.13.1,<3",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mypy>=1.15",
    "openapi-spec-validator>=0.7.1",
    "opentelemetry-sdk>=1.40,<2",
    "packaging>=25",
    "pre-commit>=4.3",
    "pylint>=4,<5",
    "pyright==1.1.414",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6",
    "pytest>=9.1",
    "ruff>=0.15",
    "smelt-cli==0.5.0",
    "twine>=7,<8",
    "types-jsonschema>=4.26",
    "uvicorn>=0.53",
    "websockets>=15",
]

[tool.uv.sources]
fastapi-canon-reference = { path = "examples/reference-service", editable = true }
fastapi-canon = { workspace = true }

[tool.fastapi-canon.database]
target = "examples.database.config:database"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "fastapi_canon/integrations/sse",
    "fastapi_canon/integrations/websockets",
    "fastapi_canon/integrations/webrtc",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fastapi_canon", "tests/unit", "tests/integration/error", "tests/contract/error", "tests/integration/test_opentelemetry.py", "tests/integration/test_feature_telemetry.py", "tests/integration/test_feature_telemetry_resources.py", "tests/integration/test_optional_streams.py", "tests/integration/integrations", "examples/canonical_errors"]
# Transport suites retain their own focused type checks in scripts/check.py.
exclude = ["fastapi_canon/integrations/(sse|websockets|webrtc)/", "tests/(unit|integration)/integrations/(sse|websockets|webrtc)/", "tests/unit/test_release.py", "examples/canonical_errors/(dist|generated)/"]
pretty = true
show_error_codes = true
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# These modules retain their own strict feature checks in scripts/check.py.
module = [
    "fastapi_canon.integrations.sse.*",
    "fastapi_canon.integrations.websockets.*",
    "fastapi_canon.integrations.webrtc.*",
]
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests/unit", "tests/integration", "tests/contract"]
asyncio_mode = "auto"
markers = [
    "snapshot: golden schemas and clients tied to the locked dependencies",
    "engine: tests that need a real WebRTC engine (aiortc)",
]
xfail_strict = true
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.canon-websockets.typecheck]
min_completeness = 0.92

[tool.pyright]
include = ["fastapi_canon/integrations/sse", "examples/sse", "tests/fixtures/sse/generated_python"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pylint.main]
py-version = "3.12"
ignore-paths = [".*/sse/codegen/templates/.*"]

[tool.pylint.messages_control]
disable = ["C", "R"]

[tool.pylint.reports]
score = false

[tool.coverage.run]
branch = true
source = ["fastapi_canon.integrations.sse", "examples.sse.agent_runs.generated_python.runtime"]
omit = ["*/codegen/templates/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
