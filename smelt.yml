# yaml-language-server: $schema=.smelt.schema.json
# Canon package guardrails; rationale: docs/architecture-guardrails.md.
# Run: uv run --locked smelt check --fail-on warning
version: 2
project:
  root_packages: [fastapi_canon, app, scripts, examples]
  source_roots: [., examples/reference-service/src]
  test_roots: [tests/unit, tests/integration, tests/contract, tests/fixtures, tests/browser, 
        examples/reference-service/tests]
  exclude:
    - path: build/**
      reason: Existing local build output and disposable compatibility worktrees, outside the 
        maintained package.
    - path: tests/__init__.py
      reason: Empty pytest package marker; test modules and fixtures are checked through their 
        declared test roots.
    - path: '**/codegen/templates/**'
      reason: Generated SDK runtime assets; checked by generator drift, consumer and client-runtime 
        suites.
    - path: examples/canonical_errors/**
      reason: Runnable demos and generated SDKs; checked by lint, consumer and installed-artifact 
        suites.
    - path: examples/showcase/**
      reason: Runnable demos and generated SDKs; checked by lint, consumer and installed-artifact 
        suites.
    - path: examples/streams/**
      reason: Runnable demos and generated SDKs; checked by lint, consumer and installed-artifact 
        suites.
    - path: examples/sse/**
      reason: Runnable demos and generated SDKs; checked by lint, consumer and installed-artifact 
        suites.
    - path: examples/websockets/**
      reason: Runnable demos and generated SDKs; checked by lint, consumer and installed-artifact 
        suites.
    - path: examples/webrtc/**
      reason: Runnable demos and generated SDKs; checked by lint, consumer and installed-artifact 
        suites.
    - path: '**/dist/**'
      reason: Build outputs and disposable validation environments.
architecture:
  composition_root:
    - fastapi_canon.__main__
    - fastapi_canon.checks.__main__
    - app.main
    - app.telemetry_demo
  layers:
    tooling:
      path: scripts
      may_depend_on: [values, responses, adapters, routing, extension, composition, contracts, 
            transport, sse, rpc, rtc, telemetry, generation, cli, analysis, persistence, mcp]
      third_party:
        default: deny
        # Installed-wheel resource smoke checks also exercise SQLAlchemy.
        allow: [packaging, fastapi, pydantic, pydantic_core, typing_extensions, starlette, dishka, 
              httpx, httpx2, jsonschema, jinja2, pytest, uvicorn, anyio, aiortc, av, opentelemetry, 
              sqlalchemy, sqlmodel, alembic, fastmcp]
      modules:
        - scripts
    showcase:
      path: examples
      may_depend_on: [values, responses, adapters, routing, extension, composition, contracts, 
            transport, sse, rpc, rtc, telemetry, generation, cli, analysis, application, persistence,
        mcp]
      third_party:
        default: deny
        allow: [fastapi, pydantic, pydantic_core, typing_extensions, starlette, dishka, 
              opentelemetry, httpx, httpx2, sqlmodel, sqlalchemy, pydantic_settings, uvicorn, anyio, 
              alembic, fastmcp]
      modules:
        - examples
    values:
      path: diagnostics
      third_party:
        default: deny
        allow: [pydantic]
      modules:
        - fastapi_canon.errors
        - fastapi_canon.error.types
        - fastapi_canon.error.error
        - fastapi_canon.error.problem
        - fastapi_canon.error.validation
        - fastapi_canon.error.rendering
        - fastapi_canon.error.contracts
        - fastapi_canon.diagnostics
        - fastapi_canon._version
    responses:
      path: response
      may_depend_on: [values]
      third_party:
        default: deny
        allow: [pydantic]
      modules:
        - fastapi_canon.response
    adapters:
      path: error
      may_depend_on: [values, responses]
      third_party:
        default: deny
        allow: [fastapi, starlette, pydantic]
      modules:
        - fastapi_canon.error
        - fastapi_canon.openapi
        - fastapi_canon.routing.traversal
    routing:
      path: routing
      may_depend_on: [values, responses, adapters]
      third_party:
        default: deny
        allow: [fastapi, starlette, pydantic]
      modules:
        - fastapi_canon.routing
    extension:
      path: integration
      may_depend_on: [values]
      third_party:
        default: deny
        # Type-only references for the extension contract.
        allow: [dishka, fastapi, starlette]
      modules:
        - fastapi_canon.integration
    composition:
      path: composition
      may_depend_on: [values, responses, adapters, routing, extension, sse, rpc]
      third_party:
        default: deny
        allow: [dishka, fastapi, starlette, pydantic, opentelemetry, typing_extensions, 
              pydantic_core, fastmcp, anyio]
      modules:
        - fastapi_canon.composition
        - fastapi_canon.routing.api_router
        - fastapi_canon.routing.injected_route
    analysis:
      path: checks
      may_depend_on: []
      third_party:
        default: deny
        allow: []
      modules:
        - fastapi_canon.checks
    persistence:
      path: database
      may_depend_on: [values, responses, adapters, routing, extension, composition, telemetry, rpc, 
            rtc, mcp]
      third_party:
        default: deny
        allow: [sqlalchemy, alembic, anyio, dishka, fastapi, starlette, pydantic, typing_extensions, 
              pydantic_core, opentelemetry, fastmcp]
      modules:
        - fastapi_canon.integrations.database

    transport:
      path: integrations
      may_depend_on: [values, responses, adapters, routing, extension]
      third_party:
        default: deny
        allow: [dishka, fastapi, starlette, pydantic, typing_extensions, pydantic_core]
      modules:
        - fastapi_canon.integrations
    mcp:
      path: mcp
      may_depend_on: [values, responses, adapters, routing, extension]
      third_party:
        default: deny
        allow: [dishka, fastapi, starlette, pydantic, fastmcp]
      modules:
        - fastapi_canon.integrations.mcp
    sse:
      path: sse
      may_depend_on: [values, responses, adapters, routing, extension]
      third_party:
        default: deny
        allow: [dishka, fastapi, starlette, pydantic, typing_extensions, pydantic_core, jsonschema, 
              jinja2]
      modules:
        - fastapi_canon.integrations.sse
    rpc:
      path: websockets
      may_depend_on: [values, responses, adapters, routing, extension]
      third_party:
        default: deny
        allow: [dishka, fastapi, starlette, pydantic, typing_extensions, pydantic_core, jinja2, 
              opentelemetry]
      modules:
        - fastapi_canon.integrations.websockets
    rtc:
      path: webrtc
      may_depend_on: [values, responses, adapters, routing, extension]
      third_party:
        default: deny
        allow:
          - dishka
          - fastapi
          - starlette
          - pydantic
          - typing_extensions
          - pydantic_core
          - anyio
          - aiortc
          - av
          - jinja2
      modules:
        - fastapi_canon.integrations.webrtc
    telemetry:
      path: opentelemetry
      may_depend_on: [values, responses, adapters, routing, extension, rpc]
      third_party:
        default: deny
        # The opt-in engine adapter uses SQLAlchemy's instance event API.
        allow: [dishka, fastapi, starlette, pydantic, typing_extensions, pydantic_core, 
              opentelemetry, sqlalchemy]
      modules:
        - fastapi_canon.integrations.opentelemetry
        - fastapi_canon.integrations.websockets.adapters.opentelemetry
    generation:
      path: codegen
      may_depend_on:
        - values
        - responses
        - adapters
        - routing
        - extension
        - sse
        - rpc
        - rtc
        - composition
        - contracts
        - telemetry
        - analysis
        - persistence
        - mcp
      third_party:
        default: deny
        allow:
          - dishka
          - fastapi
          - starlette
          - pydantic
          - typing_extensions
          - pydantic_core
          - jsonschema
          - jinja2
          - anyio
          - aiortc
          - av
          - opentelemetry
          - sqlalchemy
          - alembic
          - fastmcp
      modules:
        - fastapi_canon.cli.application
        - fastapi_canon.codegen
        - fastapi_canon.integrations.sse.codegen
        - fastapi_canon.integrations.websockets.codegen
        - fastapi_canon.integrations.webrtc.codegen
    cli:
      path: cli
      may_depend_on:
        - values
        - responses
        - adapters
        - routing
        - extension
        - sse
        - rpc
        - rtc
        - composition
        - contracts
        - generation
        - telemetry
        - analysis
        - persistence
        - mcp
      third_party:
        default: deny
        allow:
          - dishka
          - fastapi
          - starlette
          - pydantic
          - typing_extensions
          - pydantic_core
          - jsonschema
          - jinja2
          - anyio
          - aiortc
          - av
          - opentelemetry
          - sqlalchemy
          - alembic
          - fastmcp
      modules:
        - fastapi_canon.cli
    contracts:
      path: contracts
      may_depend_on: [values, responses, adapters, routing, extension, composition, sse, rpc]
      third_party:
        default: deny
        allow: [dishka, fastapi, starlette, pydantic, opentelemetry, typing_extensions, 
              pydantic_core, fastmcp, anyio]
      modules:
        - fastapi_canon.contracts
    application:
      path: application
      may_depend_on: [values, responses, adapters, routing, extension, composition, contracts, 
            telemetry, sse, rpc, rtc, persistence, mcp]
      third_party:
        default: deny
        allow:
          - dishka
          - fastapi
          - starlette
          - pydantic
          - typing_extensions
          - pydantic_core
          - opentelemetry
          - httpx
          - httpx2
          - sqlmodel
          - sqlalchemy
          - pydantic_settings
        # Applications may consume the optional Database integration; its
        # transitive implementation owns Alembic and shielded async cleanup.
          - alembic
          - fastmcp
          - anyio
      modules:
        - app
  import_graph:
    transitive: true
    type_checking: include
    cycles: [layers, siblings]
  packages:
    canon:
      match: fastapi_canon
      min_importers_to_export: 3
      required: [error, composition, routing, cli, contracts, diagnostics, openapi, response]
      # Also cover the documented extension modules and installed CLI entry point.
      public: [., error, diagnostics, errors, openapi, contracts, integration, integrations.**, 
            codegen.generators, cli]
    error-models:
      match: fastapi_canon.error
      min_importers_to_export: 3
      required: [error, problem, registry, rendering, handlers, openapi, types]
    integration-facades:
      match: fastapi_canon.integrations.*
      min_importers_to_export: 3
style:
  third_party_reexports: [fastapi, starlette, pydantic, dishka, httpx, opentelemetry]
  file_naming:
    yaml_extension: yml
    compose_basename: compose
  forbidden_names: [utils, helpers, common, misc]
  str_enum_values: explicit
  call_argument_kinds: [await]
  overrides:
    canon:
      match: fastapi_canon
      imports:
        style: absolute
      module_docstrings: forbid
      rules:
        visibility/misplaced-dunder-all: error
        complexity/excess-positional-parameters: {severity: error, max: 3}
      private_modules: forbid
      future_annotations: when-needed
      dataclass_options: [frozen, slots]
      type_dispatch:
        style: match
        min_branches: 3
      ordering:
        constants_exempt: true
    reference-application:
      match: app
      dataclass_options: [frozen, slots]
      bases:
        pydantic.BaseModel: app.presentation.schema.Schema
        sqlmodel.SQLModel: app.infrastructure.database.models.DatabaseModel
    generation-values:
      match: fastapi_canon.codegen
      dataclass_options: [frozen, slots, kw_only]
    tooling-values:
      match: scripts
      dataclass_options: [frozen, slots]
    example-values:
      match: examples
      dataclass_options: [frozen, slots]
tests:
  layout: mirror
  mirror: '{path}/test_{module}.py'
  mirror_suffixes: true
  forbidden_mock_paths: [tests/integration/**, tests/contract/**, tests/unit/error/**]
  mirror_exclude: [tests/unit/integrations/**, tests/integration/integrations/**, 
        tests/contract/integrations/**, tests/integration/test_opentelemetry.py, 
        tests/integration/test_optional_streams.py, tests/integration/codegen/**, 
        tests/integration/test_stack.py, tests/unit/test_release.py, 
        tests/integration/scripts/test_benchmark_tests.py, examples/reference-service/tests/**]
rules:
  architecture/import-cycle: error
  layout/reexport-only-module: hint
  layout/misplaced-module-logger: error
  visibility/reexport-convention: error
  complexity/inline-constructor-receiver: hint
  architecture/unclassified-module: error
  layout/definition-order: error
  idioms/bundled-instance-assignment: error
  visibility/internal-public-module-symbol: error
  visibility/internal-public-attribute: error
  visibility/test-only-public-attribute: error
  visibility/internal-public-member: error
  layout/misplaced-static-helper: error
  layout/misplaced-private-constant: error
  modeling/redundant-str-enum-value: error
  imports/prefer-package-import: error
  imports/excess-module-imports: {severity: hint, max: 20}
  architecture/missing-facade-export: hint
  modeling/prefer-str-enum-discriminator: hint
  typing/implicit-optional-default: error
  complexity/excess-attribute-depth: hint
  modeling/forbidden-base-class-affix: error
  frameworks/prefer-secret-type: error
  frameworks/redundant-dishka-provider: hint
  layout/callee-before-caller: error
  idioms/prefer-callable-instance: hint
  layout/redundant-module-name: hint
  typing/redundant-future-annotations: hint
  idioms/prefer-match-type-dispatch: hint
  tests/private-access: error
  tests/string-patch-target: error
  tests/missing-outcome-check: error
  tests/vacuous-assertion: error
  tests/unbounded-wait: error
  tests/independent-case-loop: hint
  tests/missing-await-assertion: error
  visibility/test-only-public-function: error
  tests/nondeterministic-data: error
  typing/deprecated-async-contextmanager-return: error
  typing/duplicate-literal-type: hint
  visibility/foreign-private-access: error
  complexity/inline-call-argument: error
  # These counts flag code for review. Cohesion and safe extraction need judgment.
  complexity/excess-comprehension-loops: {severity: hint, max: 2}
  complexity/excess-constructor-decisions: {severity: hint, max: 4}
  visibility/excess-private-definitions: {severity: hint, max: 12}
  modeling/str-enum-value-convention: error
  visibility/redundant-private-delegate: error
  idioms/redundant-name-alias: error
  typing/prefer-deferred-annotations: hint
  typing/anonymous-tuple-type: hint
  # Contract prose belongs where names and types do not explain the behavior.
  idioms/missing-interface-docstring: hint
  modeling/dataclass-field-mutation: error
  idioms/missing-broad-except-reason: error
  modeling/missing-dataclass-option: error
  complexity/duplicate-function: error
  modeling/prefer-project-base-class: error
  # Configuration errors, protocol failures and programming errors have different bases.
  modeling/prefer-domain-exception: off
  modeling/duplicate-class-name: error
  idioms/duplicate-narrowing-assert: error
  modeling/implicit-duration-unit: error
  complexity/forbidden-nested-conditional: error
  modeling/mutable-field-in-frozen-dataclass: error
  modeling/parallel-record-fields: hint
  idioms/loop-invariant-collection: error
  meta/unused-suppression: error
  meta/resolved-debt: error
  architecture/uncovered-source: error
  tests/excess-patches: {severity: error, max: 1}
  architecture/layer-boundary: error
  architecture/forbidden-third-party-import: error
  architecture/shared-imports-feature: error
  architecture/composition-root-leak: error
  architecture/non-public-module-import: error
  architecture/missing-required-module: error
  imports/forbidden-import-style: error
  layout/forbidden-module-name: error
  layout/module-docstring-convention: error
  layout/forbidden-private-module: error
  layout/file-name-convention: error
  tests/misplaced-test: error
  tests/forbidden-mock: error
  typing/forbidden-future-annotations: error
suppressions:
  require_reason: true
ignore:
  - rule: layout/file-name-convention
    paths: [pnpm-lock.yaml, fastapi_canon/skills/build-canon-backend/agents/openai.yaml]
    reason: pnpm and the agent skill format require these exact filenames.
  - rule: imports/forbidden-import-style
    paths: ['**/__init__.py']
    reason: Package facades deliberately use relative imports; ordinary Canon modules use absolute 
      imports.
  - rule: architecture/unknown-layer
    modules: [app.**]
    reason: The reference application uses its own feature topology, not the library layer directory
      names; architecture.modules still classifies its complete source inventory.
  - rule: architecture/unknown-layer
    modules: [examples.**]
    reason: Runnable examples use application and transport names, not library layer directories; 
      architecture.modules classifies their checked source.
  - rule: layout/forbidden-private-module
    paths: [fastapi_canon/_version.py]
    reason: The version literal is the documented input to release.toml and the build/release 
      tooling, not a hidden implementation module.
  - rule: imports/prefer-package-import
    paths: [examples/reference-service/src/app/features/tasks/infrastructure/repository.py]
    reason: Concrete repository implementations deliberately import their owned ABC from its 
      definition for nominal conformance and IDE navigation.
